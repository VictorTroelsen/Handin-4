syntax = "proto3";
package pb;
option go_package = "handin4/pb/pb;pb";

message Request{
  string message = 1;
  int64 timestamp = 2;
}

message Release{
  string node_id = 1;
}

message Response{
  bool granted = 1;
  string node_id = 2;
}

service Ricart{
  rpc RequestCS(Request) returns (Response);
  rpc ReleaseCS(Release) returns (Response);
}
